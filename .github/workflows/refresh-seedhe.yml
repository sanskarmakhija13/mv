name: Refresh Seedhe Maut Image
on:
  push:
    paths:
      - ".github/workflows/refresh-seedhe.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download high quality Seedhe Maut image
        run: node scripts/refresh-seedhe.mjs
      - name: Install dependencies
        run: npm install
      - name: Verify production build
        run: npm run build
      - name: Commit image and clean obsolete thumbnails
        run: |
          rm -f public/headliners/seedhe-maut.webp public/headliners/papon.webp public/headliners/bismil.webp
          rm -f scripts/refresh-seedhe.mjs .github/workflows/refresh-seedhe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use high quality headliner assets"
          git push origin HEAD:main
