name: Refresh Headliner Images

on:
  push:
    paths:
      - ".github/workflows/refresh-headliners.yml"
      - "scripts/refresh-headliner-images.mjs"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download validated headliner images
        run: node scripts/refresh-headliner-images.mjs
      - name: Install dependencies
        run: npm install
      - name: Verify production build
        run: npm run build
      - name: Commit refreshed images
        run: |
          rm -f scripts/refresh-headliner-images.mjs .github/workflows/refresh-headliners.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace broken headliner images with valid local assets"
          git push origin HEAD:main
