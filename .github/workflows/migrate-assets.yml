name: Migrate Legacy Media

on:
  push:
    paths:
      - ".github/workflows/migrate-assets.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download and localize legacy media
        run: node scripts/migrate-assets.mjs

      - name: Install dependencies
        run: npm install

      - name: Verify production build
        run: npm run build

      - name: Commit migrated assets
        run: |
          rm -f scripts/migrate-assets.mjs app/api/legacy-media/route.ts .github/workflows/migrate-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Migrate legacy Joomla media into repository"
          git push origin HEAD:main
